name: v4 refresh

# Keeps v4 on the site and its record current (docs/models/V4-PLAN.md).
#
# Morning pass (after warehouse.yml's 04:00 ET ingest; the shared
# concurrency group means the two never overlap):
#   1. `v4 serve --write-frames`: rebuild the player / game / live frames
#      (saved rating configs, no tuning) with today's slate as pending rows,
#      append yesterday's completed games -- regular season and postseason --
#      to every market's backfill, publish today's predictions for the v4
#      markets that are ACTIVE in model_params, and write the pregame
#      snapshot the in-game scorers read.
#   2. rebuild this season's pitch / count-state frames and score their new
#      rows the same way.
#
# Afternoon passes re-run `v4 serve` as lineups post (frames not rewritten):
# a batter scored on a projected lineup is re-scored on the posted one; game
# rows stay frozen once written, like every pregame call.
#
# Never refits and never changes which version is active: publishing only
# happens for markets a human activated (`python -m modeling v4 activate`),
# and `rollback_model` takes a market off v4 without touching this job.

on:
  schedule:
    - cron: "15 10 * * *"   # 06:15 ET (EDT): full pass
    - cron: "30 19 * * *"   # 15:30 ET: lineups for most evening games
    - cron: "15 22 * * *"   # 18:15 ET: late lineups, West Coast
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full morning pass (rebuild frames)"
        type: boolean
        default: true

concurrency:
  group: warehouse-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-modeling.txt -r requirements.txt
      - name: Which pass
        id: pass
        run: |
          m=$(TZ=America/New_York date +%-m)
          season=false
          if [ "$m" -ge 3 ] && [ "$m" -le 11 ]; then season=true; fi
          full=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            season=true; full="${{ inputs.full }}"
          elif [ "${{ github.event.schedule }}" = "15 10 * * *" ]; then
            full=true
          fi
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "::notice::season=$season full=$full"
      - name: Serve (rebuild and store frames)
        if: steps.pass.outputs.season == 'true' && steps.pass.outputs.full == 'true'
        run: python -m modeling v4 serve --write-frames
      - name: Rebuild this season's pitch and count-state frames
        if: steps.pass.outputs.season == 'true' && steps.pass.outputs.full == 'true'
        run: python -m modeling v4 frames --grain micro --seasons "$(TZ=America/New_York date +%Y)"
      - name: Score new in-game rows
        if: steps.pass.outputs.season == 'true' && steps.pass.outputs.full == 'true'
        run: python -m modeling v4 score pitch pa --publish
      - name: Serve (lineup refresh)
        if: steps.pass.outputs.season == 'true' && steps.pass.outputs.full != 'true'
        run: python -m modeling v4 serve
