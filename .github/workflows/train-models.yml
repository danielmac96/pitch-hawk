name: Train models

# Fits v1 models from the backfilled dataset and writes them to model_params
# (is_active=true). Runs on GitHub's runners, which can reach Supabase.
#
# Setup (once): add repository secrets
#   SUPABASE_URL   https://<ref>.supabase.co
#   SUPABASE_KEY   service_role key (Project Settings → API)  [kept secret]
#
# Run manually after the backfill has data, or on the weekly schedule below.

# DISABLED 2026-08-02 (Phase 3). The schedule is removed, not commented out
# inside an active `on:`, so there is no chance of it firing. scripts/
# train_models.py now exits 2 with an explanation: the train_*_cells() RPCs it
# reads were dropped in 20260802000002 because the hot-window swap cut pitches
# and at_bats to 35 days. workflow_dispatch is kept so the job can still be
# invoked deliberately once the deferred model layer re-points it at DuckDB
# over R2 -- until then it will exit 2 by design.
#
#  schedule:
#    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
on:
  workflow_dispatch:

concurrency:
  group: train-models
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Train
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/train_models.py
