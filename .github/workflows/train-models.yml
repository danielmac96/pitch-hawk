name: Train models

# Builds feature cells from the R2 Parquet warehouse and runs the offline
# workbench (modeling/) over all five markets, recording every run to
# model_runs.
#
# Setup (once): add repository secrets
#   SUPABASE_URL   https://<ref>.supabase.co
#   SUPABASE_KEY   service_role key (Project Settings -> API)  [kept secret]
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET
#
# CI RECORDS, HUMANS PROMOTE. There is deliberately no --promote below: a run
# here writes a model_runs row and nothing else, so what production serves
# never changes without someone running
#   python -m modeling train <market> --promote
# at a terminal and reading the gate's verdict.
#
# workflow_dispatch only -- no schedule. `build` scans the whole corpus
# (~2,000 Parquet files per dataset), so it costs real R2 Class B operations
# and should be an intentional act.

on:
  workflow_dispatch:

concurrency:
  group: train-models
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-modeling.txt
      - name: Build features
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m modeling build
      - name: Train (records runs, does not promote)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          # Read the registry rather than listing markets here. The hardcoded
          # list silently excluded `batter_hit` and `batter_hr` the moment
          # they were registered -- a new market would have been trained by
          # nobody and nobody would have seen an error. `all_markets()` is the
          # same source `python -m modeling list` reads.
          markets=$(python -c "from modeling.spec import all_markets; print(' '.join(all_markets()))")
          echo "training: $markets"
          for m in $markets; do
            echo "::group::$m"
            # One market failing must not stop the rest: every run is
            # recorded to model_runs either way, and a partial sweep is more
            # useful than none.
            python -m modeling train "$m" || echo "::warning::train failed for $m"
            echo "::endgroup::"
          done
