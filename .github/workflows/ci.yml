name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # requirements-warehouse.txt is what makes tests/warehouse/ more than
          # the flattener: config.py, ingest.py, manifest.py and verify.py all
          # import pyarrow, so without it they are unimportable and silently
          # uncovered. That is how the manifest self-certification defect
          # survived to 2026-08-02.
          pip install -r requirements.txt -r requirements-warehouse.txt pytest
      - name: Run tests
        run: pytest tests/ -q

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck edge functions
        run: |
          # Keep this list in sync with deploy-supabase.yml. game-predict was
          # absent from here but present there between 2026-08-06 and
          # 2026-08-08, so it deployed to production with a type error nothing
          # ever ran deno check against.
          for fn in api backfill daily-ingest game-predict live-poll odds-ingest settle; do
            echo "== $fn"
            deno check "supabase/functions/$fn/index.ts"
          done
      # The aggregate read handlers ship in the edge function, so pytest
      # cannot reach them -- backend/ is a parallel dev implementation. These
      # cover the same cases the plan asked for in tests/api/test_routes.py.
      - name: Test edge function handlers
        run: deno test --allow-net supabase/functions/tests/

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create role anon; create role authenticated;"
          # pg_cron is a Supabase-managed extension and is not installable on a
          # stock Postgres image. Several migrations do real schema work AND
          # (re)schedule a job in the same file -- 20260717000001 defines
          # prune_cron_history, 20260716000001 and 20260728000003 reschedule
          # jobs. Skipping those files to dodge the cron calls would silently
          # drop their schema changes from CI coverage, which is how every
          # migration after 2026-07-16 came to be untested.
          #
          # So: stub the surface those migrations actually touch. Bodies of
          # plpgsql functions are not resolved at CREATE time, so only the
          # objects called at top level need to exist.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists cron;
          create table if not exists cron.job (
              jobid bigserial primary key,
              jobname text unique,
              schedule text,
              command text,
              active boolean not null default true
          );
          create table if not exists cron.job_run_details (
              runid bigserial primary key,
              jobid bigint,
              end_time timestamptz
          );
          create or replace function cron.schedule(text, text, text)
          returns bigint language sql as $$
              insert into cron.job (jobname, schedule, command)
              values ($1, $2, $3)
              on conflict (jobname) do update
                  set schedule = excluded.schedule, command = excluded.command
              returning jobid;
          $$;
          create or replace function cron.unschedule(bigint)
          returns boolean language sql as $$
              delete from cron.job where jobid = $1; select true;
          $$;
          create or replace function cron.unschedule(text)
          returns boolean language sql as $$
              delete from cron.job where jobname = $1; select true;
          $$;
          SQL
          # cron.sql and harden_functions additionally need pg_net (net.http_post
          # at top level), which has no equivalent stub worth maintaining.
          for f in supabase/migrations/*.sql; do
            case "$f" in
              *_cron.sql|*_harden_functions.sql) echo "skip $f (needs pg_net)";;
              *) echo "== $f"
                 psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f";;
            esac
          done
          # idempotency: re-apply core
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260703000001_core_schema.sql
